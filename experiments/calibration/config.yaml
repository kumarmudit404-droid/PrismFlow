experiment:
  id: calibration
  description: >
    Is PrismFlow's confidence more honest than naive fusion's? ECE, the Brier
    decomposition and AURC for three systems on identical data and seeds,
    all scored by prismflow.evaluation.evaluate.

seeds: [0, 1, 2, 3, 4]

# Default synthetic generator (4 views, rho=0.3, signal_strength 1.15): the
# Part 04 baseline setting. No duplicated views -- this measures calibration
# under ordinary inter-view dependence.
data:
  n_views: 4
  rho: 0.3

# Identical to the Part 04 baseline and the clone experiment. Fixed before any
# calibration run.
training:
  epochs: 40
  batch_size: 64
  lr: 0.001
  anneal_epochs: 10
  per_view_loss_weight: 1.0

systems:
  - naive                     # trained and evaluated with use_discount=False
  - prismflow                 # trained and evaluated with use_discount=True
  - naive_weights_discounted  # naive weights, discount switched on at test time only

evaluation:
  split: test
  # ENIV is estimated per forward batch, exactly as the deployed model does.
  batch_size: 64
  n_bins: 15
  coverages: [1.0, 0.9, 0.8, 0.5]
